<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domain for sale</title>
  <meta name="description" content="This premium domain is available for purchase. Make an offer today.">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="card">
    <span class="badge">Premium Domain</span>
    <h1 id="domain-title">This domain is for sale</h1>
    <p class="tagline" id="tagline">The domain you are looking for may be available for purchase.</p>

    <div class="price-box" id="price-box">
      <p class="price-line">
        <span class="price" id="price">Make an offer</span>

    <p class="note">All offers are seriously considered. You will receive a reply within 24&nbsp;hours.</p>
  </main>

  <footer class="footer">© <span id="year">2026</span> · All rights reserved</footer>
</body>
</html>
