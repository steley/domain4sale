# 域名出售页 — catch-all 站点（所有域名共用这一个配置）
#
# 安装方法（Ubuntu）:
#   sudo apt install -y nginx
#   sudo mkdir -p /var/www/domain-sale
#   # 把项目里的 public/ 上传到 /var/www/domain-sale/public
#   sudo cp nginx-domain-sale.conf /etc/nginx/sites-available/domain-sale
#   sudo ln -sf /etc/nginx/sites-available/domain-sale /etc/nginx/sites-enabled/domain-sale
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/domain-sale/public;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 价格数据：浏览器缓存 5 分钟，改完价格最多延迟 5 分钟生效
    location = /data/domains.json {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
