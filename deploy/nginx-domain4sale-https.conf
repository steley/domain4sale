# 域名出售站 — HTTPS 版 nginx 配置（acme.sh + 多 SAN 证书方案）
#
# 前置：先运行 scripts/issue_certs.sh 签好证书。
#       它会生成 /etc/nginx/ssl/domain4sale/servers.conf ——
#       每个证书组一个 server 块 + 一个兜底 default_server 块。
#       （nginx 同一 server 块内的多张证书只按算法类型选择、不按 SNI 选择，
#         所以不能把 15 张证书塞进一个块，必须由脚本按组分块。）
# 切换方法（替换原来的 HTTP 版配置）:
#   sudo cp deploy/nginx-domain4sale-https.conf /etc/nginx/sites-available/domain4sale
#   sudo nginx -t && sudo systemctl reload nginx

# 域名数量多时避免 server_names_hash 相关报错；
# 若 nginx -t 仍提示 hash 问题（punycode 等长域名场景），调大到 128
server_names_hash_bucket_size 64;

# 80 端口：仅用于证书签发/续期验证，其余全部跳转 HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/domain4sale/public;

    # acme.sh HTTP-01 验证文件（续期时必须保留）
    location ^~ /.well-known/acme-challenge/ { }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：所有 server 块由证书脚本生成（含兜底块）。
# 证书尚未签发时该文件为空文件，nginx 仍可正常启动（此时只有 80 端口）。
include /etc/nginx/ssl/domain4sale/servers.conf;

# 如需 HTTP/2：
#   nginx >= 1.25.1 给生成的各 server 块加一行 `http2 on;`
#   nginx <  1.25.1 把生成的 listen 行改成 `listen 443 ssl http2;`
