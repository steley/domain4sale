# 域名出售站 — HTTPS 版 nginx 配置（acme.sh + 多 SAN 证书方案）
#
# 前置：先运行 scripts/issue_certs.sh 签好证书，
#       它会生成 /etc/nginx/ssl/domain-sale/certs.conf（本配置 include 的文件）
# 切换方法（替换原来的 HTTP 版配置）:
#   sudo cp deploy/nginx-domain-sale-https.conf /etc/nginx/sites-available/domain-sale
#   sudo nginx -t && sudo systemctl reload nginx

# 80 端口：仅用于证书签发/续期验证，其余全部跳转 HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/domain-sale/public;

    # acme.sh HTTP-01 验证文件（续期时必须保留）
    location ^~ /.well-known/acme-challenge/ { }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：所有域名共用的 catch-all 站点
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # 如需 HTTP/2:
    #   nginx < 1.25.1（Ubuntu 22.04/24.04 自带版本）改用: listen 443 ssl http2;
    #   nginx >= 1.25.1 用: http2 on;

    root /var/www/domain-sale/public;
    index index.html;

    # scripts/issue_certs.sh 生成的证书引用（1500 个域名 ≈ 15 张证书 = 30 行）
    include /etc/nginx/ssl/domain-sale/certs.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 价格数据：浏览器缓存 5 分钟，改完价格最多延迟 5 分钟生效
    location = /data/domains.json {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
